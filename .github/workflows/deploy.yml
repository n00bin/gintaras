name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p site
          if [ -f index.html ]; then
            rsync -a --exclude site --exclude .git --exclude .github ./ site/
          else
            unzip -o -q *.zip -d site
            if [ ! -f site/index.html ]; then
              d=$(find site -maxdepth 3 -name index.html -printf '%h\n' | head -1)
              [ -n "$d" ] && cp -r "$d"/. site/
            fi
          fi
          ls site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
